name: AK Scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ak-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan markets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TD_KEY: ${{ secrets.TD_KEY }}
        run: node scanner/scan.js
      - name: Save journal
        if: always()
        run: |
          git config user.name "ak-bot"
          git config user.email "ak-bot@users.noreply.github.com"
          git add data/journal.json
          if ! git diff --cached --quiet; then
            git commit -m "journal update"
            git pull --rebase
            git push
          fi
